<!DOCTYPE html>
<html>
<head>
  <title>Mapa Criminalidad Nueva York</title>
  <!-- CSS locales desde templates -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw/dist/leaflet.draw.css" />
  <link rel="stylesheet" href="templates/estilos.css" /> 
  
</head>
<body>
  <div id="map"></div>

  <div id="controls">
    <button onclick="buscarCriminalidad()">Buscar en zona</button>
  </div>

  <div id="rankingPanel">
    <h3>Ranking de puntos</h3>
    <div id="rankingLista"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw/dist/leaflet.draw.js"></script>
  <script>
    let bounds;

    const map = L.map('map').setView([40.7128, -74.0060], 13); // Nueva York
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    const drawnItems = new L.FeatureGroup(); // capa de rectángulo
    const puntosLayer = new L.LayerGroup();  // capa de puntos

    map.addLayer(drawnItems);
    map.addLayer(puntosLayer);

    const drawControl = new L.Control.Draw({
      draw: {
        polygon: false,
        polyline: false,
        circle: false,
        marker: false,
        circlemarker: false,
        rectangle: true
      },
      edit: {
        featureGroup: drawnItems
      }
    });
    map.addControl(drawControl);

    map.on('draw:created', function (e) {
      drawnItems.clearLayers();
      puntosLayer.clearLayers();
      drawnItems.addLayer(e.layer);
      bounds = e.layer.getBounds();
    });

    map.on('draw:edited', function (e) {
      const layers = e.layers.getLayers();
      if (layers.length > 0) {
        bounds = layers[0].getBounds();
      }
    });

    map.on('draw:deleted', function (e) {
      bounds = null;
      puntosLayer.clearLayers();
      document.getElementById("rankingPanel").style.display = "none";
    });    
  </script>

  <!-- JS locales desde templates -->
  <script src="templates/index.js"></script>
</body>
</html>
